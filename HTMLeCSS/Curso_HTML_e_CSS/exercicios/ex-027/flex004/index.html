<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightsalmon;
            height: 300px;
            display: flex;
            flex-flow: row nowrap;
            justify-content: space-between;
            align-items: center;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Espaço A</div>
        <div class="item">Espaço B</div>
        <div class="item">Espaço C</div>
        <div class="item">Espaço D</div>
        <div class="item">Espaço E</div>
        <div class="item">Espaço F</div>
        <div class="item">Espaço G</div>
    </div>
</body>
</html>
